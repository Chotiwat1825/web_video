<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PlayIDTV — สตรีมมิ่งวิดีโอ</title>
  <meta name="description" content="ดูวิดีโอออนไลน์ฟรี คุณภาพสูง อัพเดทใหม่ทุกวัน" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <!-- Embedded HLS.js for .m3u8 streaming links support on all browsers -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ===== HEADER / NAVBAR ===== -->
  <header id="site-header">
    <div class="header-inner">
      <div class="logo" id="logo-btn">
        <span class="logo-icon">▶</span>
        <span class="logo-text">PlayIDTV</span>
      </div>

      <nav class="nav-tabs" id="nav-tabs">
        <!-- dynamically inserted -->
      </nav>

      <div class="header-actions">
        <div class="search-wrap">
          <input type="text" id="search-input" class="search-input" placeholder="ค้นหาวิดีโอ..." />
          <span class="search-icon">🔍</span>
        </div>
        <button class="btn-source" id="toggle-source-btn" title="เปลี่ยนแหล่งข้อมูล">
          <span class="btn-source-icon">📂</span>
          <span>แหล่งข้อมูล</span>
        </button>
      </div>
    </div>
  </header>

  <!-- ===== HERO / FEATURED COVER ===== -->
  <section id="hero-section">
    <div class="hero-bg" id="hero-bg"></div>
    <div class="hero-overlay"></div>
    <div class="hero-content" id="hero-content">
      <div class="hero-badge">🔥 แนะนำ</div>
      <h1 class="hero-title" id="hero-title">กำลังโหลด...</h1>
      <p class="hero-desc" id="hero-desc">กำลังโหลดข้อมูล...</p>
      <div class="hero-actions">
        <button class="btn-play" id="hero-play-btn">
          <span>▶</span> เล่นเลย
        </button>
        <button class="btn-info" id="hero-info-btn">
          <span>ℹ</span> ดูรายละเอียด
        </button>
      </div>
    </div>
  </section>

  <!-- ===== MAIN CONTENT ===== -->
  <main id="main-content">

    <!-- Source selector panel -->
    <div class="source-panel" id="source-panel" style="display:none;">
      <div class="source-panel-header">
        <h3>📂 เลือกแหล่งข้อมูล</h3>
        <input type="text" id="source-search" placeholder="ค้นหาเพลย์ลิสต์..." class="source-search-input" />
      </div>
      <div class="source-list" id="source-list">
        <!-- dynamically inserted from playlists_index.json -->
      </div>
    </div>

    <!-- Group filter chips -->
    <div class="group-filter" id="group-filter">
      <div class="filter-scroll" id="filter-scroll">
        <!-- dynamically inserted -->
      </div>
    </div>

    <!-- Video grid -->
    <div class="section-header">
      <h2 class="section-title" id="section-title">รายการทั้งหมด</h2>
      <span class="video-count" id="video-count"></span>
    </div>

    <div class="video-grid" id="video-grid">
      <!-- dynamically inserted -->
    </div>

    <div class="load-more-wrap">
      <button class="btn-load-more" id="load-more-btn" onclick="loadMore()">โหลดเพิ่มเติม ↓</button>
    </div>

  </main>

  <!-- ===== VIDEO PLAYER MODAL ===== -->
  <div class="modal-overlay" id="modal-overlay" onclick="closeModal(event)">
    <div class="modal-container" id="modal-container">
      <button class="modal-close" id="modal-close-btn" onclick="closeModal()">✕</button>

      <!-- Video Player -->
      <div class="player-wrap">
        <video
          id="video-player"
          controls
          autoplay
          playsinline
          preload="metadata"
          poster=""
        ></video>
        <div class="player-loading" id="player-loading">
          <div class="spinner"></div>
          <p>กำลังโหลดวิดีโอ...</p>
        </div>
      </div>

      <!-- Video Info -->
      <div class="modal-info">
        <div class="modal-badge-row">
          <span class="badge badge-hd">HD</span>
          <span class="badge badge-free">FREE</span>
          <span class="modal-group-tag" id="modal-group-tag"></span>
        </div>
        <h2 class="modal-title" id="modal-title"></h2>
        <div class="modal-meta">
          <span id="modal-meta-code"></span>
        </div>
        <div class="modal-actions">
          <button class="btn-modal-action" id="btn-prev" onclick="navigateVideo(-1)">⬅ ก่อนหน้า</button>
          <button class="btn-modal-action" id="btn-next" onclick="navigateVideo(1)">ถัดไป ➡</button>
          <button class="btn-modal-action" onclick="copyVideoUrl()">🔗 คัดลอกลิงก์</button>
        </div>
        <div class="related-videos" id="related-videos">
          <h4>วิดีโอที่เกี่ยวข้อง</h4>
          <div class="related-grid" id="related-grid"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- ===== TOAST ===== -->
  <div class="toast" id="toast"></div>

  <!-- ===== SCRIPTS ===== -->
  <script src="app.js"></script>
</body>
</html>
